[package]
name = "probes"
description = "loads scope's ebpf programs and turns their maps into events"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# needs nightly + bpf-linker at build time (see lab/docker/ebpf.Dockerfile),
# or SCOPE_EBPF_OBJ pointing at a prebuilt object.
ebpf = ["dep:aya", "dep:blazesym", "dep:probe-abi", "probe-abi/user"]

[dependencies]
telemetry.workspace = true
probe-abi = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.16", optional = true }
blazesym = { version = "0.2", optional = true }
libc.workspace = true

[dev-dependencies]
uffd.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
