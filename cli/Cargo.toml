[package]
name = "cli"
description = "scope: read-only observability for firecracker microvms"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scope"
path = "src/main.rs"

[features]
# ebpf: scope flame and fault record. needs nightly + bpf-linker on linux builds;
# --no-default-features gives a stable-only build with top and fault serve/show.
default = ["ebpf"]
ebpf = ["dep:probes", "probes/ebpf", "dep:flame"]

[dependencies]
telemetry.workspace = true
host.workspace = true
kvm.workspace = true
metrics.workspace = true
api.workspace = true
export.workspace = true
fault.workspace = true
libc.workspace = true
probes = { workspace = true, optional = true }
flame = { workspace = true, optional = true }
replay.workspace = true
top.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[dev-dependencies]
tempfile.workspace = true
telemetry.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
uffd.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
uffd.workspace = true
libc.workspace = true

[lints]
workspace = true
