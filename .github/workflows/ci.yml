name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: shellcheck -x -e SC1091,SC2013 lab/*.sh

  test:
    strategy:
      matrix:
        # native runners for both arches: arch-specific code is cfg-gated, so build *and* run on each.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      # the live test needs CAP_NET_ADMIN for its tap check.
      - run: sudo -E env "PATH=$PATH" cargo test -p host --test live

  macos:
    # dev box build: linux-only code must stay cfg-gated.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
