name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # stable-only build: no ebpf object, so no nightly/bpf-linker here.
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: shellcheck -x -e SC1091,SC2013 lab/*.sh

  test:
    strategy:
      matrix:
        # native runners for both arches: arch-specific code is cfg-gated, so build *and* run on each.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --no-default-features
      # live tests need root: tap creation (CAP_NET_ADMIN) and userfaultfd.
      - run: sudo -E env "PATH=$PATH" cargo test --no-default-features -p host --test live
      - run: sudo -E env "PATH=$PATH" cargo test --no-default-features -p uffd -p cli

  ebpf:
    # nightly + bpf-linker + a real kernel. the docker image pins the toolchain;
    # --privileged gives the container CAP_BPF/CAP_PERFMON and userfaultfd.
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scope-ebpf -f lab/docker/ebpf.Dockerfile lab/docker
      - run: >
          docker run --rm --privileged -v "$PWD:/src" -w /src scope-ebpf sh -c
          'cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace'

  macos:
    # dev box build: linux-only code must stay cfg-gated.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
